worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/json;

    server_tokens off;
    access_log /dev/stdout;

    client_max_body_size 1m;
    client_body_buffer_size 1m;

    # A non-root worker/master cannot create temporary directories under the
    # installation prefix. Keep every NGINX request-buffer path writable.
    client_body_temp_path /tmp/client_body;
    proxy_temp_path      /tmp/proxy_temp;
    fastcgi_temp_path    /tmp/fastcgi_temp;
    uwsgi_temp_path      /tmp/uwsgi_temp;
    scgi_temp_path       /tmp/scgi_temp;

    keepalive_timeout 30s;
    send_timeout 30s;

    server {
        listen 8080;
        listen [::]:8080 ipv6only=on;
        server_name _;

        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;

        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            content_by_lua_block {
                local cjson = require "cjson.safe"
                local max_body_bytes = 65536
                local redacted_headers = {
                    ["authorization"] = true,
                    ["proxy-authorization"] = true,
                    ["cookie"] = true,
                    ["set-cookie"] = true,
                    ["x-api-key"] = true,
                    ["x-auth-token"] = true,
                }

                local function is_sensitive_header(name)
                    local key = string.lower(name)
                    return redacted_headers[key]
                        or string.find(key, "token", 1, true) ~= nil
                        or string.find(key, "secret", 1, true) ~= nil
                        or string.find(key, "password", 1, true) ~= nil
                        or string.find(key, "api%-key") ~= nil
                end

                ngx.req.read_body()

                local request_headers, header_error = ngx.req.get_headers(100, true)
                local headers = {}
                for name, value in pairs(request_headers) do
                    local key = string.lower(name)
                    if is_sensitive_header(key) then
                        headers[key] = "[REDACTED]"
                    elseif type(value) == "table" then
                        headers[key] = value
                    else
                        headers[key] = value
                    end
                end

                local body = ngx.req.get_body_data()
                if not body then
                    local body_file = ngx.req.get_body_file()
                    if body_file then
                        local file = io.open(body_file, "rb")
                        if file then
                            body = file:read(max_body_bytes + 1)
                            file:close()
                        end
                    end
                end
                body = body or ""

                local body_truncated = #body > max_body_bytes
                if body_truncated then
                    body = string.sub(body, 1, max_body_bytes)
                end

                local result = {
                    method = ngx.req.get_method(),
                    request_uri = ngx.var.request_uri,
                    http_version = ngx.req.http_version(),
                    host = ngx.var.host,
                    remote_addr = ngx.var.remote_addr,
                    headers = headers,
                    headers_truncated = header_error == "truncated",
                    body = body,
                    body_truncated = body_truncated,
                }

                local encoded, encode_error = cjson.encode(result)
                if not encoded then
                    ngx.log(ngx.ERR, "failed to encode request echo: ", encode_error or "unknown error")
                    ngx.status = ngx.HTTP_INTERNAL_SERVER_ERROR
                    ngx.say('{"error":"failed to encode request"}')
                    return
                end

                ngx.header.content_type = "application/json; charset=utf-8"
                ngx.say(encoded)
            }
        }
    }
}
